name: Release Multi-Platform App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            output_pattern: 'release/*.exe'
          - os: macos-14
            platform: mac
            output_pattern: 'release/*.dmg, release/*.zip'
          - os: ubuntu-22.04
            platform: linux
            output_pattern: 'release/*.AppImage, release/*.deb, release/*.tar.gz'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libnotify4 libnss3 libasound2 libsecret-1-0

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build and Package (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            npm run package:win
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            npm run package:mac
          else
            npm run package:linux
          fi
        shell: bash

      - name: Upload Build Artifacts (Actions Run)
        uses: actions/upload-artifact@v4
        with:
          name: mypost-${{ matrix.platform }}-builds
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: ignore

      - name: Upload Release Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/latest*.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
